<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Cartel QR · Mamma Nicoletta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,700;1,600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,sans-serif;background:#e9e3d8;color:#2A2622;display:flex;flex-direction:column;align-items:center;gap:18px;padding:24px 16px}
.barra{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;font-size:14px;color:#6F675D;text-align:center}
.barra button{font:600 15px Inter,sans-serif;background:#B8432F;color:#fff;border:0;border-radius:999px;padding:11px 22px;cursor:pointer}
.cartel{width:105mm;height:148mm;max-width:100%;background:#FFFDF8;border:2mm solid #1F3B2A;outline:.6mm solid #C9A45C;outline-offset:-4.5mm;padding:12mm 9mm 9mm;display:flex;flex-direction:column;align-items:center;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.15)}
.cartel small{letter-spacing:.3em;text-transform:uppercase;font-size:8.5pt;color:#B8432F;font-weight:600}
.cartel h1{font-family:"Cormorant Garamond",serif;font-size:31pt;line-height:1;color:#1F3B2A;margin-top:2mm}
.cartel .frase{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:14pt;color:#6F675D;margin-top:1mm}
.cartel img{width:58mm;height:58mm;margin:7mm 0 5mm}
.cartel b{font-size:13pt;color:#1F3B2A}
.cartel p{font-size:10pt;color:#6F675D;margin-top:1.5mm;line-height:1.35}
.cartel .pie{margin-top:auto;font-size:8pt;color:#9a9083}
@media print{
  @page{size:A6;margin:0}
  body{background:#fff;padding:0;display:block}
  .barra{display:none}
  .cartel{box-shadow:none;width:105mm;height:148mm}
}
</style>
</head>
<body>
<div class="barra"><button onclick="window.print()">Imprimir cartel</button><span>Tamaño A6 (media hoja A5). Para el mostrador, la vidriera o un portacartel de mesa.</span></div>
<div class="cartel">
  <small>Pastas frescas · Pilar</small>
  <h1>Mamma Nicoletta</h1>
  <div class="frase">como en lo de la Nona</div>
  <img src="img/qr-menu.svg" alt="Código QR al menú">
  <b>Escaneá y mirá el menú</b>
  <p>Encargá desde el celular y retirá<br>el día y el horario que elijas</p>
  <div class="pie">Chacabuco 576 · Ruta 8 y Guido</div>
</div>
</body>
</html>
