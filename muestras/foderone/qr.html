<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Cartel QR · Foderone Trattoria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,700;1,700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,sans-serif;background:#e9e3d8;color:#2A2622;display:flex;flex-direction:column;align-items:center;gap:18px;padding:24px 16px}
.barra{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;font-size:14px;color:#6F675D;text-align:center;align-items:center}
.barra button{font:600 15px Inter,sans-serif;background:#C8372D;color:#fff;border:0;border-radius:999px;padding:11px 22px;cursor:pointer}
.cartel{width:105mm;height:148mm;max-width:100%;background:#FFFCF6;border:2mm solid #1F1A17;outline:.6mm solid #EDBE4F;outline-offset:-4.5mm;padding:12mm 9mm 9mm;display:flex;flex-direction:column;align-items:center;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.15)}
.cartel small{letter-spacing:.3em;text-transform:uppercase;font-size:8pt;color:#C8372D;font-weight:600}
.cartel h1{font-family:"Fraunces",serif;font-size:28pt;line-height:1.02;color:#1F1A17;margin-top:2mm}
.cartel .frase{font-family:"Fraunces",serif;font-style:italic;font-size:13pt;color:#6F675D;margin-top:1.5mm}
.cartel img{width:56mm;height:56mm;margin:6mm 0 5mm}
.cartel b{font-size:13pt;color:#1F1A17}
.cartel p{font-size:10pt;color:#6F675D;margin-top:1.5mm;line-height:1.35}
.cartel .pie{margin-top:auto;font-size:8pt;color:#9a9083}
@media print{@page{size:A6;margin:0}body{background:#fff;padding:0;display:block}.barra{display:none}.cartel{box-shadow:none}}
</style>
</head>
<body>
<div class="barra"><button onclick="window.print()">Imprimir cartel</button><span>Tamaño A6 (media hoja A5). Para las mesas, el mostrador o la vidriera.</span></div>
<div class="cartel">
  <small>Pizzería · Pilar</small>
  <h1>Foderone Trattoria</h1>
  <div class="frase">Escaneá y pedí desde la mesa</div>
  <img src="img/qr-menu.svg" alt="Código QR a la carta">
  <b>Escaneá y mirá la carta</b>
  <p>Pedí para llevar o reservá tu mesa<br>desde el celular</p>
  <div class="pie">Tucumán 675, Pilar, Buenos Aires</div>
</div>
</body>
</html>
